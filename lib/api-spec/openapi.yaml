openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.2.0
  description: XAGUSD Screener API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: signals
    description: XAGUSD signal operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /levels:
    get:
      operationId: getLevels
      tags: [signals]
      summary: Get key price levels and clear trade signal
      description: Returns pivot-point-derived support/resistance levels, buy/sell zones, and a single clear trade signal for the requested symbol
      parameters:
        - in: query
          name: symbol
          schema:
            type: string
            enum: ["XAGUSD", "XAUUSD", "EURUSD", "GBPUSD", "AUDUSD", "USDJPY", "GBPJPY", "BTCUSD", "ETHUSD"]
            default: "XAGUSD"
          description: Trading instrument
        - in: query
          name: timeframe
          schema:
            type: string
            enum: ["1m", "15m", "30m", "1h", "1d"]
            default: "1d"
          description: Bar timeframe used to compute pivots and zones
        - in: query
          name: accountSize
          schema:
            type: number
            minimum: 1
            default: 500
          description: Trading account size in USD used to compute position sizing
        - in: query
          name: riskPct
          schema:
            type: number
            minimum: 0.01
            maximum: 100
            default: 1
          description: Percent of account risked per trade (1 = 1%)
        - in: query
          name: minCollateral
          schema:
            type: number
            minimum: 0.01
            default: 10
          description: Minimum collateral the exchange will accept per position (USD). Defaults to Jupiter perps minimum of $10.
        - in: query
          name: maxLeverage
          schema:
            type: number
            minimum: 1
            maximum: 200
            default: 50
          description: Maximum leverage the trader is willing to use. Defaults to 50x for Jupiter perps.
      responses:
        "200":
          description: Price levels and signal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LevelsData"

  /backtest:
    get:
      operationId: getBacktest
      tags: [signals]
      summary: Backtest the signal criteria over historical candles
      description: Replays the buy/sell zone signal logic over historical candles for the requested symbol and timeframe.
      parameters:
        - in: query
          name: symbol
          schema:
            type: string
            enum: ["XAGUSD", "XAUUSD", "EURUSD", "GBPUSD", "AUDUSD", "USDJPY", "GBPJPY", "BTCUSD", "ETHUSD"]
            default: "XAGUSD"
          description: Trading instrument
        - in: query
          name: timeframe
          schema:
            type: string
            enum: ["1m", "15m", "30m", "1h", "1d"]
            default: "1d"
          description: Bar timeframe used for the backtest
      responses:
        "200":
          description: Backtest results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BacktestResult"

  /price-history:
    get:
      operationId: getPriceHistory
      tags: [signals]
      summary: Get price history aligned to live OANDA spot
      parameters:
        - in: query
          name: symbol
          schema:
            type: string
            enum: ["XAGUSD", "XAUUSD", "EURUSD", "GBPUSD", "AUDUSD", "USDJPY", "GBPJPY", "BTCUSD", "ETHUSD"]
            default: "XAGUSD"
          description: Trading instrument
        - in: query
          name: timeframe
          schema:
            type: string
            enum: ["1m", "15m", "30m", "1h", "1d"]
            default: "1d"
          description: Bar timeframe
        - in: query
          name: bars
          schema:
            type: integer
            default: 200
          description: Number of bars to return
      responses:
        "200":
          description: Price history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PriceHistory"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    Candle:
      type: object
      properties:
        date:
          type: string
        open:
          type: number
        high:
          type: number
        low:
          type: number
        close:
          type: number
        volume:
          type: number
      required: [date, open, high, low, close, volume]

    PriceHistory:
      type: object
      properties:
        symbol:
          type: string
        candles:
          type: array
          items:
            $ref: "#/components/schemas/Candle"
        currentPrice:
          type: number
          description: Live OANDA spot price (also used to align candles)
        lastUpdated:
          type: string
      required: [symbol, candles, currentPrice, lastUpdated]

    PriceLevel:
      type: object
      properties:
        label:
          type: string
          description: e.g. "R3", "S1", "Fib 61.8%", "Swing High"
        price:
          type: number
        type:
          type: string
          enum: [resistance, support, pivot]
      required: [label, price, type]

    TradeZone:
      type: object
      properties:
        low:
          type: number
        high:
          type: number
        label:
          type: string
      required: [low, high, label]

    LevelsData:
      type: object
      properties:
        symbol:
          type: string
        currentPrice:
          type: number
        priceChange:
          type: number
        priceChangePct:
          type: number
        signal:
          type: string
          enum: [BUY, SELL, WAIT]
          description: Single clear trade signal
        signalReason:
          type: string
          description: Plain-language explanation of why this signal was generated
        entryPrice:
          type: number
          description: Ideal entry price
        stopLoss:
          type: number
          description: Recommended stop loss
        takeProfit1:
          type: number
          description: First take profit target
        takeProfit2:
          type: number
          description: Second take profit target
        riskRewardRatio:
          type: number
          description: Risk/reward ratio for the trade
        buyZone:
          $ref: "#/components/schemas/TradeZone"
        sellZone:
          $ref: "#/components/schemas/TradeZone"
        levels:
          type: array
          items:
            $ref: "#/components/schemas/PriceLevel"
          description: All key support and resistance levels
        pivot:
          type: number
          description: Daily pivot point
        trend:
          type: string
          enum: [UPTREND, DOWNTREND, RANGING]
          description: Current market structure
        trendStrength:
          type: number
          description: 0-100 strength score
        lastUpdated:
          type: string
        positionSizing:
          $ref: "#/components/schemas/PositionSizing"
      required:
        - symbol
        - currentPrice
        - priceChange
        - priceChangePct
        - signal
        - signalReason
        - entryPrice
        - stopLoss
        - takeProfit1
        - takeProfit2
        - riskRewardRatio
        - buyZone
        - sellZone
        - levels
        - pivot
        - trend
        - trendStrength
        - lastUpdated

    PositionSizing:
      type: object
      description: Suggested position size for a $500 starting account at 1% risk per trade.
      properties:
        accountSize:
          type: number
          description: Account size in USD used for sizing
        riskAmount:
          type: number
          description: Dollar amount risked per trade if stop is hit
        riskPct:
          type: number
          description: Risk percent of account (e.g. 1.0 = 1%)
        positionSize:
          type: number
          description: Position size in base units (coins, oz, base currency)
        positionSizeUnit:
          type: string
          description: Unit label for positionSize (BTC, ETH, oz, EUR, etc.)
        notional:
          type: number
          description: Approximate USD notional value of the position
        leverage:
          type: number
          description: Suggested minimum leverage multiplier (perps only)
        leverageNote:
          type: string
          description: Warning text when required leverage is high
        lots:
          type: object
          description: Lot breakdown for forex / metals
          properties:
            standard:
              type: number
            mini:
              type: number
            micro:
              type: number
          required: [standard, mini, micro]
        achievable:
          $ref: "#/components/schemas/AchievablePosition"
      required:
        - accountSize
        - riskAmount
        - riskPct
        - positionSize
        - positionSizeUnit
        - notional

    AchievablePosition:
      type: object
      description: Position scaled to honour exchange minimums (e.g. Jupiter $10 minimum collateral). Shows what the trader can ACTUALLY take and the real dollar P&L at each level.
      properties:
        positionSize:
          type: number
          description: Actual position size in base units after applying exchange constraints
        notional:
          type: number
          description: Actual notional value in USD
        collateral:
          type: number
          description: Recommended collateral to deposit (USD). At least minCollateral.
        leverage:
          type: number
          description: Leverage to set on the exchange so notional = collateral × leverage
        actualRiskAmount:
          type: number
          description: Actual dollar loss if SL is hit (may differ from intended riskAmount when minimum forces over-sizing)
        actualRiskPct:
          type: number
          description: actualRiskAmount as a percent of account
        pnlAtSL:
          type: number
          description: Signed dollar P&L if stop loss hits (always negative)
        pnlAtTP1:
          type: number
          description: Signed dollar P&L if TP1 hits (positive)
        pnlAtTP2:
          type: number
          description: Signed dollar P&L if TP2 hits (positive)
        belowMinimum:
          type: boolean
          description: True when ideal notional was below the exchange minimum and position was forced over-sized
        warning:
          type: string
          description: Human-readable warning when constraints affected the trade
      required:
        - positionSize
        - notional
        - collateral
        - leverage
        - actualRiskAmount
        - actualRiskPct
        - pnlAtSL
        - pnlAtTP1
        - pnlAtTP2
        - belowMinimum

    BacktestTrade:
      type: object
      properties:
        entryDate:
          type: string
        direction:
          type: string
          enum: [BUY, SELL]
        entry:
          type: number
        stopLoss:
          type: number
        takeProfit1:
          type: number
        takeProfit2:
          type: number
        exitDate:
          type: string
        exitPrice:
          type: number
        outcome:
          type: string
          enum: [TP1, TP2, SL, EXPIRED]
        rMultiple:
          type: number
          description: Profit/loss in units of risk (R)
        barsHeld:
          type: integer
      required:
        - entryDate
        - direction
        - entry
        - stopLoss
        - takeProfit1
        - takeProfit2
        - exitDate
        - exitPrice
        - outcome
        - rMultiple
        - barsHeld

    BacktestResult:
      type: object
      properties:
        symbol:
          type: string
        startDate:
          type: string
        endDate:
          type: string
        totalBars:
          type: integer
        totalTrades:
          type: integer
        winningTrades:
          type: integer
        losingTrades:
          type: integer
        winRate:
          type: number
          description: Percentage of trades that hit at least TP1
        totalReturnR:
          type: number
          description: Cumulative R-multiples
        avgReturnR:
          type: number
          description: Average R per trade
        profitFactor:
          type: number
          description: Gross profit / gross loss
        maxDrawdownR:
          type: number
          description: Largest peak-to-trough drawdown in R
        avgBarsHeld:
          type: number
        buyTrades:
          type: integer
        sellTrades:
          type: integer
        buyWinRate:
          type: number
        sellWinRate:
          type: number
        tp1Hits:
          type: integer
        tp2Hits:
          type: integer
        slHits:
          type: integer
        expiredHits:
          type: integer
        trades:
          type: array
          items:
            $ref: "#/components/schemas/BacktestTrade"
          description: Most recent trades (capped to last 50 for response size)
        lastUpdated:
          type: string
      required:
        - symbol
        - startDate
        - endDate
        - totalBars
        - totalTrades
        - winningTrades
        - losingTrades
        - winRate
        - totalReturnR
        - avgReturnR
        - profitFactor
        - maxDrawdownR
        - avgBarsHeld
        - buyTrades
        - sellTrades
        - buyWinRate
        - sellWinRate
        - tp1Hits
        - tp2Hits
        - slHits
        - expiredHits
        - trades
        - lastUpdated
