openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.2.0
  description: XAGUSD Screener API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: signals
    description: XAGUSD signal operations
  - name: push
    description: Web Push subscription management for browser notifications
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /levels:
    get:
      operationId: getLevels
      tags: [signals]
      summary: Get key price levels and clear trade signal
      description: Returns pivot-point-derived support/resistance levels, buy/sell zones, and a single clear trade signal for the requested symbol
      parameters:
        - in: query
          name: symbol
          schema:
            type: string
            default: "XAGUSD"
          description: Trading instrument — static key (e.g. XAGUSD, BTCUSD) or a dynamic trending coin key (e.g. TONUSDT)
        - in: query
          name: timeframe
          schema:
            type: string
            enum: ["1h", "4h", "1d", "1w"]
            default: "1d"
          description: Bar timeframe used to compute pivots and zones
        - in: query
          name: accountSize
          schema:
            type: number
            minimum: 1
            default: 500
          description: Trading account size in USD used to compute position sizing
        - in: query
          name: riskPct
          schema:
            type: number
            minimum: 0.01
            maximum: 100
            default: 1
          description: Percent of account risked per trade (1 = 1%)
        - in: query
          name: minCollateral
          schema:
            type: number
            minimum: 0.01
            default: 10
          description: Minimum collateral the exchange will accept per position (USD). Defaults to Jupiter perps minimum of $10.
        - in: query
          name: maxLeverage
          schema:
            type: number
            minimum: 1
            maximum: 200
            default: 50
          description: Maximum leverage the trader is willing to use. Defaults to 50x for Jupiter perps.
        - in: query
          name: mt5Lots
          schema:
            type: number
            minimum: 0.01
            maximum: 100
            default: 0.01
          description: MetaTrader 5 lot size used to size forex/metals positions. Ignored for crypto perps (BTC/ETH) which use Jupiter collateral × leverage. Default 0.01 (1 micro lot).
      responses:
        "200":
          description: Price levels and signal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LevelsData"

  /backtest:
    get:
      operationId: getBacktest
      tags: [signals]
      summary: Backtest the signal criteria over historical candles
      description: Replays the buy/sell zone signal logic over historical candles for the requested symbol and timeframe.
      parameters:
        - in: query
          name: symbol
          schema:
            type: string
            enum: ["XAGUSD", "XAUUSD", "EURUSD", "GBPUSD", "AUDUSD", "BTCUSD", "ETHUSD", "SOLUSD", "SKYAIUSDT", "ZECUSD"]
            default: "XAGUSD"
          description: Trading instrument
        - in: query
          name: timeframe
          schema:
            type: string
            enum: ["1h", "4h", "1d", "1w"]
            default: "1d"
          description: Bar timeframe used for the backtest
        - in: query
          name: signalType
          schema:
            type: string
            enum: ["FIB50_SWING"]
            default: "FIB50_SWING"
          description: "Which signal mode to backtest. FIB50_SWING = daily-timeframe swing fibonacci retracement entry at the 50% fib level."
      responses:
        "200":
          description: Backtest results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BacktestResult"

  /active-signals:
    get:
      operationId: getActiveSignals
      tags: [signals]
      summary: All currently-active BUY/SELL signals across symbols × timeframes
      description: Recomputes every tracked symbol × timeframe and returns the BUY/SELL signals as a single overview. Each entry includes the timeframe alongside the standard LevelsData payload so the client can render and deep-link without extra calls. Sizing inputs (accountSize, riskPct, minCollateral, maxLeverage) flow through to every entry's positionSizing block — pass the trader's actual settings so the overview's $P&L matches the main signal panel.
      parameters:
        - in: query
          name: accountSize
          schema:
            type: number
            minimum: 1
            default: 500
          description: Trading account size in USD used to compute position sizing for every entry
        - in: query
          name: riskPct
          schema:
            type: number
            minimum: 0.01
            maximum: 100
            default: 1
          description: Percent of account risked per trade (1 = 1%)
        - in: query
          name: minCollateral
          schema:
            type: number
            minimum: 0.01
            default: 10
          description: Minimum collateral the exchange will accept per position (USD). Defaults to Jupiter perps minimum of $10.
        - in: query
          name: maxLeverage
          schema:
            type: number
            minimum: 1
            maximum: 200
            default: 50
          description: Maximum leverage the trader is willing to use. Defaults to 50x for Jupiter perps.
        - in: query
          name: mt5Lots
          schema:
            type: number
            minimum: 0.01
            maximum: 100
            default: 0.01
          description: MetaTrader 5 lot size used to size forex/metals positions in every entry. Ignored for crypto perps (BTC/ETH).
      responses:
        "200":
          description: Active signals overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActiveSignalsResponse"

  /trending-symbols:
    get:
      operationId: getTrendingSymbols
      tags: [signals]
      summary: Get currently-trending coins discovered from CoinGecko gainers + OKX
      description: Returns the top trending coins validated against CoinGecko gainers, OKX USDT SWAP instruments (for candle data), and Phemex USDT-perp listing (for trading). Updated every 4 hours. Coins expire after 8 hours (cooldown window preserves active-trade context after a coin drops out of the gainers list).
      responses:
        "200":
          description: Trending symbols
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrendingSymbolsResponse"

  /push/vapid-public-key:
    get:
      operationId: getVapidPublicKey
      tags: [push]
      summary: Get the server's VAPID public key for browser subscription
      description: Returns the public half of the VAPID keypair used to sign Web Push payloads. The browser passes this to PushManager.subscribe() before posting the resulting subscription back via /push/subscribe.
      responses:
        "200":
          description: VAPID public key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VapidPublicKey"
        "503":
          description: VAPID keys not configured on the server

  /push/subscribe:
    post:
      operationId: subscribePush
      tags: [push]
      summary: Register a browser Web Push subscription
      description: Stores a Web Push subscription so the server can fan out signal alerts to it. Idempotent — re-posting the same endpoint upserts the existing record.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PushSubscriptionPayload"
      responses:
        "200":
          description: Subscription stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PushSubscribeResponse"

  /push/unsubscribe:
    post:
      operationId: unsubscribePush
      tags: [push]
      summary: Remove a browser Web Push subscription
      description: Deletes the subscription matching the supplied endpoint. Safe to call when no matching row exists.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PushUnsubscribeRequest"
      responses:
        "200":
          description: Subscription removed (or already absent)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PushSubscribeResponse"

  /trade-history:
    get:
      operationId: getTradeHistory
      tags: [signals]
      summary: Closed trade history with P&L tracking
      description: Returns historically closed trades logged by the signal engine (SL hits, TP2 hits, BE-trail closes, direction reversals, and missed pending orders).
      parameters:
        - in: query
          name: symbol
          schema:
            type: string
          required: false
          description: Filter by symbol key (e.g. XAGUSD). Returns all symbols if omitted.
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
          required: false
          description: Maximum number of records to return, newest first.
      responses:
        "200":
          description: Closed trade history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TradeHistoryResponse"

  /signal-log:
    get:
      operationId: getSignalLog
      tags: [signals]
      summary: Append-only log of every fired signal
      description: Returns a permanent record of every BUY/SELL signal that fired, including TP1, TP2, SL levels. Unlike closed_trades this log is never deleted — signals that were lost due to server restarts or missed eviction are still here.
      parameters:
        - in: query
          name: symbol
          schema:
            type: string
          required: false
          description: Filter by symbol key (e.g. ZECUSD). Returns all symbols if omitted.
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 200
          required: false
          description: Maximum number of records to return, newest first.
      responses:
        "200":
          description: Signal log
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignalLogResponse"

  /price-history:
    get:
      operationId: getPriceHistory
      tags: [signals]
      summary: Get price history aligned to live OANDA spot
      parameters:
        - in: query
          name: symbol
          schema:
            type: string
            enum: ["XAGUSD", "XAUUSD", "EURUSD", "GBPUSD", "AUDUSD", "BTCUSD", "ETHUSD", "SOLUSD", "SKYAIUSDT", "ZECUSD"]
            default: "XAGUSD"
          description: Trading instrument
        - in: query
          name: timeframe
          schema:
            type: string
            enum: ["1h", "4h", "1d", "1w"]
            default: "1d"
          description: Bar timeframe
        - in: query
          name: bars
          schema:
            type: integer
            default: 200
          description: Number of bars to return
      responses:
        "200":
          description: Price history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PriceHistory"

  /news:
    get:
      operationId: getNews
      tags: [signals]
      summary: Get crypto market news and top gainers
      responses:
        "200":
          description: Latest market news and top gainers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewsResponse"

components:
  schemas:
    VapidPublicKey:
      type: object
      properties:
        publicKey:
          type: string
          description: Base64URL-encoded VAPID public key suitable for PushManager.subscribe applicationServerKey
      required:
        - publicKey

    PushSubscriptionKeys:
      type: object
      properties:
        p256dh:
          type: string
          description: Browser-supplied P-256 ECDH public key (base64url)
        auth:
          type: string
          description: Browser-supplied auth secret (base64url)
      required:
        - p256dh
        - auth

    PushSubscriptionPayload:
      type: object
      properties:
        endpoint:
          type: string
          description: Push service endpoint URL (FCM / APNs gateway)
        keys:
          $ref: "#/components/schemas/PushSubscriptionKeys"
        userAgent:
          type: string
          description: Optional User-Agent string for diagnostics
      required:
        - endpoint
        - keys

    PushUnsubscribeRequest:
      type: object
      properties:
        endpoint:
          type: string
      required:
        - endpoint

    PushSubscribeResponse:
      type: object
      properties:
        ok:
          type: boolean
      required:
        - ok

    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    Candle:
      type: object
      properties:
        date:
          type: string
        open:
          type: number
        high:
          type: number
        low:
          type: number
        close:
          type: number
        volume:
          type: number
      required: [date, open, high, low, close, volume]

    PriceHistory:
      type: object
      properties:
        symbol:
          type: string
        candles:
          type: array
          items:
            $ref: "#/components/schemas/Candle"
        currentPrice:
          type: number
          description: Live OANDA spot price (also used to align candles)
        lastUpdated:
          type: string
      required: [symbol, candles, currentPrice, lastUpdated]

    PriceLevel:
      type: object
      properties:
        label:
          type: string
          description: e.g. "R3", "S1", "Fib 61.8%", "Swing High"
        price:
          type: number
        type:
          type: string
          enum: [resistance, support, pivot]
      required: [label, price, type]

    TradeZone:
      type: object
      properties:
        low:
          type: number
        high:
          type: number
        label:
          type: string
      required: [low, high, label]

    LevelsData:
      type: object
      properties:
        symbol:
          type: string
        currentPrice:
          type: number
        priceChange:
          type: number
        priceChangePct:
          type: number
        signal:
          type: string
          enum: [BUY, SELL, WAIT]
          description: Single clear trade signal
        signalType:
          type: string
          enum: [FIB50_SWING, DOUBLE_TOP, DOUBLE_BOTTOM, BB_REJECTION]
          description: "Which signal mode generated this signal. FIB50_SWING = swing fibonacci retracement: enter at 50% fib of recent swing, TP1 at 78.6% fib, SL 2:1 R:R. DOUBLE_TOP = bearish reversal; entry at resistance, TP1 at neckline. DOUBLE_BOTTOM = bullish reversal; entry at support, TP1 at neckline. BB_REJECTION = Bollinger Band exhaustion reversal; entry at BB30 extreme, TP1 at 50% fib of recent swing, SL 2:1 R:R."
        signalReason:
          type: string
          description: Plain-language explanation of why this signal was generated
        tradeState:
          type: string
          enum: [WAIT, PENDING, FILLED_PROFIT, FILLED_DRAWDOWN, FILLED_TP1, FILLED_TP2, FILLED_SL]
          description: Machine-readable trade lifecycle state. WAIT = no setup. PENDING = limit staged but not yet tagged. FILLED_DRAWDOWN/PROFIT = position open between entry and SL/TP1. FILLED_TP1/TP2/SL = price has reached that level (TP2/SL trigger invalidation on the next tick). Always prefer this over parsing signalReason text.
        entryPrice:
          type: number
          description: Ideal entry price
        stopLoss:
          type: number
          description: Recommended stop loss
        takeProfit1:
          type: number
          description: First take profit target
        takeProfit2:
          type: number
          description: Second take profit target
        dca1:
          type: number
          description: DCA level at the 61.8% retracement — add to position here if price pulls deeper before reversing. Absent on WAIT signals.
        riskRewardRatio:
          type: number
          description: Risk/reward ratio for the trade
        buyZone:
          $ref: "#/components/schemas/TradeZone"
        sellZone:
          $ref: "#/components/schemas/TradeZone"
        levels:
          type: array
          items:
            $ref: "#/components/schemas/PriceLevel"
          description: All key support and resistance levels
        pivot:
          type: number
          description: Daily pivot point
        trend:
          type: string
          enum: [UPTREND, DOWNTREND, RANGING]
          description: Current market structure
        trendStrength:
          type: number
          description: 0-100 strength score (equals ADX value when ADX is warm)
        adx:
          type: number
          description: ADX-14 value (0-100). <25 = ranging, 25-50 = trending, >50 = strong trend. Absent when insufficient candle history.
        choppiness:
          type: number
          description: Choppiness Index-14 (0-100). >61.8 = thick/choppy market (ranges, mean-reversion favoured). <38.2 = thin/directional market (trending, momentum favoured). Thresholds are Fibonacci levels.
        swingRhythm:
          type: object
          description: Cadence of recent price oscillations over the last 60 bars. Absent when fewer than 3 pivot highs/lows are found.
          properties:
            avgBarsPerSwing:
              type: number
              description: Average number of bars between consecutive swing highs and lows (time rhythm).
            avgPricePerSwing:
              type: number
              description: Average price distance per swing, expressed as a multiple of ATR-14 (amplitude rhythm).
        rsi:
          type: number
          description: RSI-14 value (0-100). BUY signals require ≤40; SELL signals require ≥60.
        detectedPattern:
          type: string
          enum:
            - HEAD_AND_SHOULDERS
            - INVERSE_HEAD_AND_SHOULDERS
            - DOUBLE_TOP
            - DOUBLE_BOTTOM
            - ASCENDING_TRIANGLE
            - DESCENDING_TRIANGLE
            - SYMMETRICAL_TRIANGLE
            - RISING_WEDGE
            - FALLING_WEDGE
            - BULL_FLAG
            - BEAR_FLAG
            - BULL_PENNANT
            - BEAR_PENNANT
            - BULLISH_ENGULFING
            - BEARISH_ENGULFING
            - HAMMER
            - SHOOTING_STAR
          description: "Chart or candlestick pattern detected on this symbol/timeframe. Absent when none found. Confirmed reversal patterns (H&S, Double Top/Bottom) gate signal entries; continuation and candlestick patterns are informational/reinforcing only."
        patternDirection:
          type: string
          enum: [bearish, bullish]
          description: "Trade direction implied by the detected pattern. Absent when no pattern is detected."
        patternConfirmed:
          type: boolean
          description: "True when the key level has broken on a closed bar (not just a wick). Only confirmed reversal patterns are used as veto gates."
        patternNeckline:
          type: number
          description: "Price level of the lower rail or neckline at the current bar. Absent when no pattern detected."
        patternUpperBound:
          type: number
          description: "Price level of the upper rail at the current bar for two-line patterns (triangles, wedges, flags). Absent for single-line patterns and when no pattern is detected."
        patternNecklineStart:
          type: number
          description: "Lower rail price at the start of the pattern (patternStartDate). Present for triangles and wedges only — use with patternNeckline to draw a diagonal lower trendline."
        patternUpperBoundStart:
          type: number
          description: "Upper rail price at the start of the pattern (patternStartDate). Present alongside patternNecklineStart."
        patternStartDate:
          type: string
          description: "ISO date string of the earliest swing point used to build the diagonal trendlines (triangles and wedges). Use toTime() on this value to anchor the left end of the rails."
        patternEndDate:
          type: string
          description: "ISO date string of the last completed bar (n-2) used as the right anchor of the diagonal trendlines. Price is always within the rails at this bar — the current in-progress bar (n-1) is deliberately excluded to prevent confirmed-breakout price from floating outside the lines."
        lastUpdated:
          type: string
        positionSizing:
          $ref: "#/components/schemas/PositionSizing"
      required:
        - symbol
        - currentPrice
        - priceChange
        - priceChangePct
        - signal
        - signalType
        - signalReason
        - tradeState
        - entryPrice
        - stopLoss
        - takeProfit1
        - takeProfit2
        - riskRewardRatio
        - buyZone
        - sellZone
        - levels
        - pivot
        - trend
        - trendStrength
        - lastUpdated

    PositionSizing:
      type: object
      description: Suggested position size for the trader's account. The `venue` field decides which downstream block is authoritative — PHEMEX (crypto USDT-perps) renders `achievable`, MT5 (forex/metals) renders `mt5`, PHEMEX_SPOT (spot tokens) renders `spotToken`.
      properties:
        venue:
          type: string
          enum: [PHEMEX, MT5, PHEMEX_SPOT]
          description: Which trading venue this symbol uses. PHEMEX = Phemex USDT-margined perps (BTC/ETH, collateral × leverage, up to 100×). MT5 = MetaTrader 5 (forex/metals, lot-based sizing). PHEMEX_SPOT = Phemex spot (no leverage, whole-token sizing).
        accountSize:
          type: number
          description: Account size in USD used for sizing
        riskAmount:
          type: number
          description: Dollar amount risked per trade if stop is hit (PHEMEX venue's risk-budget; on MT5 venue this is the *would-be* budget, not the actual lot-based risk — read mt5.pnlAtSL for the actual loss)
        riskPct:
          type: number
          description: Risk percent of account (e.g. 1.0 = 1%)
        positionSize:
          type: number
          description: Position size in base units (coins, oz, base currency)
        positionSizeUnit:
          type: string
          description: Unit label for positionSize (BTC, ETH, oz, EUR, etc.)
        notional:
          type: number
          description: Approximate USD notional value of the position
        leverage:
          type: number
          description: Suggested minimum leverage multiplier (perps only)
        leverageNote:
          type: string
          description: Warning text when required leverage is high
        lots:
          type: object
          description: Lot breakdown for forex / metals
          properties:
            standard:
              type: number
            mini:
              type: number
            micro:
              type: number
          required: [standard, mini, micro]
        achievable:
          $ref: "#/components/schemas/AchievablePosition"
        mt5:
          $ref: "#/components/schemas/MT5Sizing"
        spotToken:
          $ref: "#/components/schemas/SpotTokenSizing"
      required:
        - venue
        - accountSize
        - riskAmount
        - riskPct
        - positionSize
        - positionSizeUnit
        - notional

    SpotTokenSizing:
      type: object
      description: Spot token sizing for Coinbase spot instruments (no leverage). Token count = riskAmount ÷ |entry − stopLoss|, rounded down to whole tokens.
      properties:
        tokenCount:
          type: integer
          description: Number of whole tokens to buy
        tokenSymbol:
          type: string
          description: Token ticker label (e.g. "SKYAI")
        notional:
          type: number
          description: USD notional value of the position (tokenCount × entry)
        riskAmount:
          type: number
          description: Actual dollar risk on SL hit (tokenCount × |entry − stopLoss|)
        riskPct:
          type: number
          description: riskAmount as a percent of accountSize
        pnlAtSL:
          type: number
          description: Signed dollar P&L if stop loss hits (always negative)
        pnlAtTP1:
          type: number
          description: Signed dollar P&L if TP1 hits (positive)
        pnlAtTP2:
          type: number
          description: Signed dollar P&L if TP2 hits (positive)
      required:
        - tokenCount
        - tokenSymbol
        - notional
        - riskAmount
        - riskPct
        - pnlAtSL
        - pnlAtTP1
        - pnlAtTP2

    MT5Sizing:
      type: object
      description: MetaTrader 5 lot-based sizing for forex and metals. The trader chooses a fixed lot size (default 0.01 = 1 micro lot); the dollar P&L at SL/TP1/TP2 is derived from the pair's contract size. All supported forex pairs (GBPUSD, AUDUSD) are X/USD — the quote is already USD so no currency conversion is needed.
      properties:
        lots:
          type: number
          description: Lot size the trader will place (e.g. 0.01 = 1 micro lot, 0.10 = 1 mini lot, 1.00 = 1 standard lot)
        contractSize:
          type: number
          description: Units of base asset per 1.0 standard lot (100,000 for forex, 100 oz for XAU, 5,000 oz for XAG)
        positionSize:
          type: number
          description: Total base units this trade controls (lots × contractSize)
        positionSizeUnit:
          type: string
          description: Unit label for positionSize (EUR, GBP, AUD, USD, oz)
        notional:
          type: number
          description: Approximate USD notional value of the position
        pnlAtSL:
          type: number
          description: Signed dollar P&L if stop loss hits (always negative)
        pnlAtTP1:
          type: number
          description: Signed dollar P&L if TP1 hits (positive)
        pnlAtTP2:
          type: number
          description: Signed dollar P&L if TP2 hits (positive)
        riskPctOfAccount:
          type: number
          description: "Absolute pnlAtSL as a percent of the account size — useful for sanity-checking that 0.01 lots isn't over-leveraging the account on a high-pip-value pair like XAGUSD"
        recommendedLots:
          type: number
          description: "Lot size that would risk approximately the configured riskPct of the account on SL hit. Rounded down to 0.01 increments and clamped to a sane min/max. Use this to size a trade that's actually worth taking on small accounts where 0.01 lots yields cents."
        recommendedTargetRiskPct:
          type: number
          description: "The riskPct used to derive recommendedLots (mirrors the request's riskPct query param)."
      required:
        - lots
        - contractSize
        - positionSize
        - positionSizeUnit
        - notional
        - pnlAtSL
        - pnlAtTP1
        - pnlAtTP2
        - riskPctOfAccount
        - recommendedLots
        - recommendedTargetRiskPct

    AchievablePosition:
      type: object
      description: Position scaled to honour exchange minimums (e.g. Jupiter $10 minimum collateral). Shows what the trader can ACTUALLY take and the real dollar P&L at each level.
      properties:
        positionSize:
          type: number
          description: Actual position size in base units after applying exchange constraints
        notional:
          type: number
          description: Actual notional value in USD
        collateral:
          type: number
          description: Recommended collateral to deposit (USD). At least minCollateral.
        leverage:
          type: number
          description: Leverage to set on the exchange so notional = collateral × leverage
        actualRiskAmount:
          type: number
          description: Actual dollar loss if SL is hit (may differ from intended riskAmount when minimum forces over-sizing)
        actualRiskPct:
          type: number
          description: actualRiskAmount as a percent of account
        pnlAtSL:
          type: number
          description: Signed dollar P&L if stop loss hits (always negative)
        pnlAtTP1:
          type: number
          description: Signed dollar P&L if TP1 hits (positive)
        pnlAtTP2:
          type: number
          description: Signed dollar P&L if TP2 hits (positive)
        belowMinimum:
          type: boolean
          description: True when ideal notional was below the exchange minimum and position was forced over-sized
        warning:
          type: string
          description: Human-readable warning when constraints affected the trade
      required:
        - positionSize
        - notional
        - collateral
        - leverage
        - actualRiskAmount
        - actualRiskPct
        - pnlAtSL
        - pnlAtTP1
        - pnlAtTP2
        - belowMinimum

    TrendingSymbol:
      type: object
      description: A dynamically-discovered trending coin with an OKX USDT SWAP instrument.
      properties:
        symbolKey:
          type: string
          description: Internal symbol key (e.g. TONUSDT)
        baseAsset:
          type: string
          description: Base ticker (e.g. TON)
        okxSymbol:
          type: string
          description: OKX SWAP instrument ID (e.g. TON-USDT-SWAP)
        phemexSymbol:
          type: string
          description: Phemex perp symbol (e.g. TONUSDT)
        decimals:
          type: integer
        priceChange24h:
          type: number
          description: 24-hour price change percent
        rank:
          type: integer
          description: Rank among current trending coins (1 = top gainer)
        discoveredAt:
          type: string
        expiresAt:
          type: string
      required: [symbolKey, baseAsset, okxSymbol, phemexSymbol, decimals, priceChange24h, rank, discoveredAt, expiresAt]

    TrendingSymbolsResponse:
      type: object
      properties:
        symbols:
          type: array
          items:
            $ref: "#/components/schemas/TrendingSymbol"
        lastUpdated:
          type: string
      required: [symbols, lastUpdated]

    SignalConfluence:
      type: object
      description: Level overlap detected with another active signal on the same symbol. Signals a layered-setup opportunity or a strong zone where multiple timeframes agree.
      properties:
        type:
          type: string
          enum: ["TP1_AT_ENTRY", "TP2_AT_ENTRY", "ENTRY_ZONE_OVERLAP"]
          description: "TP1_AT_ENTRY: this signal's TP1 lands at another signal's entry. TP2_AT_ENTRY: TP2 lands at the other entry. ENTRY_ZONE_OVERLAP: both entries are confluent (same direction)."
        withTimeframe:
          type: string
        withSignal:
          type: string
          enum: ["BUY", "SELL"]
        myLevel:
          type: string
          enum: ["TP1", "TP2", "ENTRY"]
        myPrice:
          type: number
        theirLevel:
          type: string
          enum: ["ENTRY", "TP1"]
        theirPrice:
          type: number
        overlapPct:
          type: number
          description: Percentage price difference between the two levels (lower = tighter overlap)
        label:
          type: string
          description: Human-readable description of the overlap shown in the UI
      required: [type, withTimeframe, withSignal, myLevel, myPrice, theirLevel, theirPrice, overlapPct, label]

    ActiveSignalEntry:
      type: object
      description: One active BUY/SELL signal in the overview. Wraps a LevelsData payload with the timeframe so the client can route on click.
      properties:
        symbol:
          type: string
          description: Symbol key (static or trending dynamic coin)
        timeframe:
          type: string
          enum: ["1h", "4h", "1d", "1w"]
        levels:
          $ref: "#/components/schemas/LevelsData"
        category:
          type: string
          enum: ["SWING", "POSITION"]
          description: "Trade duration category derived from timeframe: SWING=1h/4h, POSITION=1d/1w"
        confluence:
          $ref: "#/components/schemas/SignalConfluence"
      required: [symbol, timeframe, levels, category]

    ActiveSignalsCoverage:
      type: object
      description: Per-request data-feed health. Lets the UI distinguish "no signals" (succeeded == total, signals empty) from "data feed degraded" (failed > 0).
      properties:
        total:
          type: integer
          description: Total symbol × timeframe combos attempted
        succeeded:
          type: integer
          description: Combos that returned a usable result (BUY, SELL, or WAIT)
        failed:
          type: integer
          description: Combos that errored or had insufficient data
        failedSymbols:
          type: array
          items:
            type: string
          description: Distinct symbols with at least one failed combo
      required: [total, succeeded, failed, failedSymbols]

    ActiveSignalsResponse:
      type: object
      properties:
        signals:
          type: array
          items:
            $ref: "#/components/schemas/ActiveSignalEntry"
          description: Every currently-active BUY/SELL signal. Empty array means no actionable signals right now.
        coverage:
          $ref: "#/components/schemas/ActiveSignalsCoverage"
        lastUpdated:
          type: string
      required: [signals, coverage, lastUpdated]

    BacktestTrade:
      type: object
      properties:
        entryDate:
          type: string
        direction:
          type: string
          enum: [BUY, SELL]
        entry:
          type: number
        stopLoss:
          type: number
        takeProfit1:
          type: number
        takeProfit2:
          type: number
        exitDate:
          type: string
        exitPrice:
          type: number
        outcome:
          type: string
          enum: [TP1, TP2, SL, EXPIRED]
        rMultiple:
          type: number
          description: Profit/loss in units of risk (R)
        barsHeld:
          type: integer
      required:
        - entryDate
