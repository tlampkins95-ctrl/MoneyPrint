        - entry
        - stopLoss
        - takeProfit1
        - takeProfit2
        - exitDate
        - exitPrice
        - outcome
        - rMultiple
        - barsHeld

    ClosedTrade:
      type: object
      properties:
        id:
          type: integer
        key:
          type: string
          description: Composite key (e.g. XAGUSD::1h)
        symbol:
          type: string
        timeframe:
          type: string
        signal:
          type: string
          enum: [BUY, SELL]
        signalType:
          type: string
          enum: [FIB50_SWING, DOUBLE_TOP, DOUBLE_BOTTOM, BB_REJECTION]
        entryPrice:
          type: number
        stopLoss:
          type: number
        takeProfit1:
          type: number
        takeProfit2:
          type: number
        riskRewardRatio:
          type: number
        exitPrice:
          type: number
        outcome:
          type: string
          enum: [SL, BE_TRAIL, TP2, REVERSED, MISSED]
          description: "SL=stop hit, BE_TRAIL=closed flat after TP1 trail, TP2=full target, REVERSED=signal flipped, MISSED=pending never filled"
        rMultiple:
          type: number
          description: Profit/loss in units of initial risk (R)
        tp1Hit:
          type: boolean
          description: Whether TP1 was reached before the trade closed
        openedAt:
          type: integer
          description: Unix ms timestamp when the signal was first staged
        closedAt:
          type: integer
          description: Unix ms timestamp when the trade was closed
      required:
        - id
        - key
        - symbol
        - timeframe
        - signal
        - signalType
        - entryPrice
        - stopLoss
        - takeProfit1
        - takeProfit2
        - riskRewardRatio
        - exitPrice
        - outcome
        - rMultiple
        - tp1Hit
        - closedAt

    TradeHistoryResponse:
      type: object
      properties:
        trades:
          type: array
          items:
            $ref: "#/components/schemas/ClosedTrade"
        totalTrades:
          type: integer
        totalR:
          type: number
