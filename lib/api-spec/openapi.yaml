openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.2.0
  description: XAGUSD Screener API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: signals
    description: XAGUSD signal operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /levels:
    get:
      operationId: getLevels
      tags: [signals]
      summary: Get key price levels and clear trade signal
      description: Returns pivot-point-derived support/resistance levels, buy/sell zones, and a single clear trade signal for XAGUSD
      responses:
        "200":
          description: Price levels and signal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LevelsData"

  /backtest:
    get:
      operationId: getBacktest
      tags: [signals]
      summary: Backtest the signal criteria over historical candles
      description: Replays the buy/sell zone signal logic over the last ~2 years of daily candles and returns aggregate performance stats and individual trade outcomes.
      responses:
        "200":
          description: Backtest results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BacktestResult"

  /price-history:
    get:
      operationId: getPriceHistory
      tags: [signals]
      summary: Get XAGUSD price history
      parameters:
        - in: query
          name: bars
          schema:
            type: integer
            default: 60
          description: Number of bars to return
      responses:
        "200":
          description: Price history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PriceHistory"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    Candle:
      type: object
      properties:
        date:
          type: string
        open:
          type: number
        high:
          type: number
        low:
          type: number
        close:
          type: number
        volume:
          type: number
      required: [date, open, high, low, close, volume]

    PriceHistory:
      type: object
      properties:
        symbol:
          type: string
        candles:
          type: array
          items:
            $ref: "#/components/schemas/Candle"
        lastUpdated:
          type: string
      required: [symbol, candles, lastUpdated]

    PriceLevel:
      type: object
      properties:
        label:
          type: string
          description: e.g. "R3", "S1", "Fib 61.8%", "Swing High"
        price:
          type: number
        type:
          type: string
          enum: [resistance, support, pivot]
      required: [label, price, type]

    TradeZone:
      type: object
      properties:
        low:
          type: number
        high:
          type: number
        label:
          type: string
      required: [low, high, label]

    LevelsData:
      type: object
      properties:
        symbol:
          type: string
        currentPrice:
          type: number
        priceChange:
          type: number
        priceChangePct:
          type: number
        signal:
          type: string
          enum: [BUY, SELL, WAIT]
          description: Single clear trade signal
        signalReason:
          type: string
          description: Plain-language explanation of why this signal was generated
        entryPrice:
          type: number
          description: Ideal entry price
        stopLoss:
          type: number
          description: Recommended stop loss
        takeProfit1:
          type: number
          description: First take profit target
        takeProfit2:
          type: number
          description: Second take profit target
        riskRewardRatio:
          type: number
          description: Risk/reward ratio for the trade
        buyZone:
          $ref: "#/components/schemas/TradeZone"
        sellZone:
          $ref: "#/components/schemas/TradeZone"
        levels:
          type: array
          items:
            $ref: "#/components/schemas/PriceLevel"
          description: All key support and resistance levels
        pivot:
          type: number
          description: Daily pivot point
        trend:
          type: string
          enum: [UPTREND, DOWNTREND, RANGING]
          description: Current market structure
        trendStrength:
          type: number
          description: 0-100 strength score
        lastUpdated:
          type: string
      required:
        - symbol
        - currentPrice
        - priceChange
        - priceChangePct
        - signal
        - signalReason
        - entryPrice
        - stopLoss
        - takeProfit1
        - takeProfit2
        - riskRewardRatio
        - buyZone
        - sellZone
        - levels
        - pivot
        - trend
        - trendStrength
        - lastUpdated

    BacktestTrade:
      type: object
      properties:
        entryDate:
          type: string
        direction:
          type: string
          enum: [BUY, SELL]
        entry:
          type: number
        stopLoss:
          type: number
        takeProfit1:
          type: number
        takeProfit2:
          type: number
        exitDate:
          type: string
        exitPrice:
          type: number
        outcome:
          type: string
          enum: [TP1, TP2, SL, EXPIRED]
        rMultiple:
          type: number
          description: Profit/loss in units of risk (R)
        barsHeld:
          type: integer
      required:
        - entryDate
        - direction
        - entry
        - stopLoss
        - takeProfit1
        - takeProfit2
        - exitDate
        - exitPrice
        - outcome
        - rMultiple
        - barsHeld

    BacktestResult:
      type: object
      properties:
        symbol:
          type: string
        startDate:
          type: string
        endDate:
          type: string
        totalBars:
          type: integer
        totalTrades:
          type: integer
        winningTrades:
          type: integer
        losingTrades:
          type: integer
        winRate:
          type: number
          description: Percentage of trades that hit at least TP1
        totalReturnR:
          type: number
          description: Cumulative R-multiples
        avgReturnR:
          type: number
          description: Average R per trade
        profitFactor:
          type: number
          description: Gross profit / gross loss
        maxDrawdownR:
          type: number
          description: Largest peak-to-trough drawdown in R
        avgBarsHeld:
          type: number
        buyTrades:
          type: integer
        sellTrades:
          type: integer
        buyWinRate:
          type: number
        sellWinRate:
          type: number
        tp1Hits:
          type: integer
        tp2Hits:
          type: integer
        slHits:
          type: integer
        expiredHits:
          type: integer
        trades:
          type: array
          items:
            $ref: "#/components/schemas/BacktestTrade"
          description: Most recent trades (capped to last 50 for response size)
        lastUpdated:
          type: string
      required:
        - symbol
        - startDate
        - endDate
        - totalBars
        - totalTrades
        - winningTrades
        - losingTrades
        - winRate
        - totalReturnR
        - avgReturnR
        - profitFactor
        - maxDrawdownR
        - avgBarsHeld
        - buyTrades
        - sellTrades
        - buyWinRate
        - sellWinRate
        - tp1Hits
        - tp2Hits
        - slHits
        - expiredHits
        - trades
        - lastUpdated
